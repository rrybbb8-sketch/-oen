<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VELOSAUR · 恐龙骑行实验室</title>
<style>
:root{--cyan:#63f5ff;--orange:#ff9b52;--ink:#07101d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}#app{width:100%;height:100%}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;left:28px;top:24px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 24px #63f5ff66}.brand b{display:block;font-size:clamp(18px,2.5vw,30px);font-weight:900}.brand span{font-size:10px;color:#9bb3c8}.panel{position:absolute;right:24px;top:24px;padding:14px 16px;min-width:180px;border:1px solid #ffffff22;border-radius:16px;background:#07101d99;backdrop-filter:blur(16px);box-shadow:0 10px 40px #0005}.stat{display:flex;justify-content:space-between;gap:30px;font-size:11px;color:#9eb4c5;margin:5px 0}.stat strong{color:#fff;font-size:14px}.meter{height:5px;margin-top:10px;border-radius:9px;background:#ffffff19;overflow:hidden}.meter i{display:block;height:100%;width:78%;background:linear-gradient(90deg,#ff694c,#ffd166,#63f5ff);box-shadow:0 0 14px #63f5ff}.help{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);padding:10px 15px;border:1px solid #ffffff20;border-radius:99px;background:#07101daa;backdrop-filter:blur(10px);font-size:11px;color:#bfd0dc;white-space:nowrap}.help kbd{padding:3px 6px;border:1px solid #ffffff33;border-radius:5px;color:#fff;background:#ffffff13}.tag{position:absolute;left:28px;bottom:28px;font-size:11px;color:#9eb4c5}.tag b{color:var(--orange)}button{pointer-events:auto;border:0;color:#fff;cursor:pointer}.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 24px;border-radius:99px;background:linear-gradient(100deg,#ff704f,#ffbd5a);font-weight:800;letter-spacing:.08em;box-shadow:0 0 30px #ff704f88;transition:.2s}.start:hover{transform:translate(-50%,-50%) scale(1.05)}.touch{position:absolute;right:24px;bottom:22px;display:none;gap:8px}.touch button{width:48px;height:48px;border:1px solid #ffffff2b;border-radius:14px;background:#07101dcc;font-size:18px}@media(max-width:700px){.panel{right:14px;top:14px;min-width:145px}.brand{left:15px;top:16px}.help{bottom:84px;font-size:10px}.tag{left:15px;bottom:16px}.touch{display:flex}.stat{gap:14px}}
</style>
</head>
<body><div id="app"></div><div class="ui">
<div class="brand"><b>VELOSAUR</b><span>prehistoric mobility lab / 03</span></div>
<div class="panel"><div class="stat"><span>距离 DISTANCE</span><strong id="distance">0000 m</strong></div><div class="stat"><span>速度 VELOCITY</span><strong id="speed">12 km/h</strong></div><div class="stat"><span>能量 ENERGY</span><strong id="energy">78%</strong></div><div class="meter"><i id="meter"></i></div></div>
<div class="tag">LIVE TERRAIN · <b id="mode">SUNSET</b></div>
<div class="help"><kbd>W</kbd>/<kbd>↑</kbd> 加速　 <kbd>A</kbd>/<kbd>D</kbd> 转向　 <kbd>SPACE</kbd> 跳跃　 <kbd>N</kbd> 昼夜</div>
<div class="touch"><button data-key="left">‹</button><button data-key="jump">↟</button><button data-key="right">›</button></div><button class="start" id="start">进入骑行模式</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';
const app=document.querySelector('#app'), scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x17283a,35,145);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);camera.position.set(8,5.4,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=7;controls.maxDistance=19;controls.maxPolarAngle=1.45;controls.target.set(0,2,0);
const hemi=new THREE.HemisphereLight(0x8ddcff,0x1a0f22,2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffc276,4);sun.position.set(-12,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const world=new THREE.Group();scene.add(world);const mat=(c,rough=.75,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
const road= new THREE.Mesh(new THREE.PlaneGeometry(24,180),mat(0x18232d));road.rotation.x=-Math.PI/2;road.position.z=-38;road.receiveShadow=true;world.add(road);for(let i=-1;i<=1;i++){const line=new THREE.Mesh(new THREE.PlaneGeometry(.09,180),mat(0xffbf68,.4));line.rotation.x=-Math.PI/2;line.position.set(i*2.5,.012,-38);world.add(line)}
const grass=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x102d2c));grass.rotation.x=-Math.PI/2;grass.position.y=-.06;grass.position.z=-38;world.add(grass);
function tree(x,z,s=1){let g=new THREE.Group();g.position.set(x,0,z);let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.24*s,2.2*s,7),mat(0x573828));trunk.position.y=1.1*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<3;i++){let crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.15-i*.16)*s,1),mat(i%2?0x164f42:0x1d6b4d));crown.position.set((i-1)*.35*s,(2.1+i*.35)*s,(i%2)*.2);crown.castShadow=true;g.add(crown)}world.add(g)}
for(let i=0;i<32;i++)tree((Math.random()<.5?-1:1)*(5+Math.random()*12),-i*5-4,.5+Math.random()*1.5);
// dinosaur body
const rider=new THREE.Group();rider.position.y=.15;scene.add(rider);const green=mat(0x63b96a),light=mat(0x9ade75),dark=mat(0x28533c),orange=mat(0xff9857),black=mat(0x101522,.35,.2);
function mesh(geo,m,pos){let q=new THREE.Mesh(geo,m);q.position.set(...pos);q.castShadow=true;q.receiveShadow=true;return q}
rider.add(mesh(new THREE.SphereGeometry(1.05,24,16),green,[0,2.7,0]));rider.add(mesh(new THREE.SphereGeometry(.66,20,14),light,[.78,3.45,-.05]));rider.add(mesh(new THREE.ConeGeometry(.16,.9,8),dark,[1.34,3.48,-.05]).rotateZ(-1.1));
for(let i=0;i<5;i++){let s=mesh(new THREE.ConeGeometry(.12,.42,7),orange,[-.35+i*.28,3.7,-.05]);s.rotateZ(-.15);rider.add(s)}rider.add(mesh(new THREE.SphereGeometry(.11,12,8),black,[1.02,3.62,-.55]));rider.add(mesh(new THREE.SphereGeometry(.11,12,8),black,[1.02,3.62,.43]));
const legL=mesh(new THREE.CylinderGeometry(.16,.21,.95,10),green,[-.55,1.9,-.4]);const legR=legL.clone();legR.position.z=.4;rider.add(legL,legR);const armL=mesh(new THREE.CylinderGeometry(.11,.14,.75,10),light,[.32,2.7,-.8]);armL.rotation.x=-.7;const armR=armL.clone();armR.position.z=.8;rider.add(armL,armR);
// bicycle
const bike=new THREE.Group();rider.add(bike);function wheel(z){let w=new THREE.Mesh(new THREE.TorusGeometry(.78,.075,12,32),black);w.rotation.y=Math.PI/2;w.position.set(0,1.05,z);w.castShadow=true;bike.add(w);let hub=mesh(new THREE.CylinderGeometry(.09,.09,.13,12),orange,[0,1.05,z]);hub.rotation.x=Math.PI/2;bike.add(hub)}wheel(-.98);wheel(.98);let frame=mat(0xff7b45,.35,.35);function bar(a,b){let d=new THREE.Vector3().subVectors(new THREE.Vector3(...b),new THREE.Vector3(...a)),m=mesh(new THREE.CylinderGeometry(.075,.075,d.length,10),frame,[0,0,0]);m.position.copy(new THREE.Vector3(...a).add(new THREE.Vector3(...b)).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());bike.add(m)}bar([0,1.05,-.98],[0,2.05,0]);bar([0,1.05,.98],[0,2.05,0]);bar([0,2.05,0],[0,1.05,.98]);bar([0,1.05,-.98],[0,1.05,.98]);let seat=mesh(new THREE.BoxGeometry(.5,.1,.35),black,[0,2.15,0]);bike.add(seat);let handle=mesh(new THREE.CylinderGeometry(.05,.05,.8,10),frame,[0,2.45,.98]);handle.rotation.x=Math.PI/2;bike.add(handle);
// particles / stars
const starGeo=new THREE.BufferGeometry(),pts=[];for(let i=0;i<600;i++)pts.push((Math.random()-.5)*100,Math.random()*45+3,-Math.random()*130);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xa8eaff,size:.08,transparent:true,opacity:.7}));scene.add(stars);
let moving=0,dist=0,energy=78,jump=0,night=false,started=false;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump=Math.max(jump,.8);if(e.key.toLowerCase()==='n')night=!night});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.key]=1;b.onpointerup=()=>keys[b.dataset.key]=0});document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#start').style.display='none'};
function animate(t){requestAnimationFrame(animate);let dt=.016;let boost=(keys.w||keys.arrowup)?1.5:1;moving+=(moving<3?dt*boost:-dt*.4);moving=Math.max(0,Math.min(3,moving));if(started){dist+=moving*dt*2.6;energy=Math.max(0,energy-dt*(moving>2.7?1.5:.12));rider.position.x+=(keys.a||keys.left?-1:keys.d||keys.right?1:0)*dt*3;rider.position.x=THREE.MathUtils.clamp(rider.position.x,-2.8,2.8);if(jump>0){jump-=dt;rider.position.y=Math.sin((.8-jump)*Math.PI/.8)*1.6}else rider.position.y=0.15}bike.rotation.x+=dt*(moving*3);rider.rotation.z+=(THREE.MathUtils.clamp(rider.position.x*.03,-.1,.1)-rider.rotation.z)*.08;world.position.z+=moving*dt*3;if(world.position.z>5)world.position.z=0;const target=night?0x050914:0x17283a;scene.background=new THREE.Color(target);scene.fog.color.set(target);sun.intensity=night?1.1:4;hemi.intensity=night?.65:2;stars.visible=night;document.querySelector('#distance').textContent=String(Math.floor(dist)).padStart(4,'0')+' m';document.querySelector('#speed').textContent=Math.floor(12+moving*18)+' km/h';document.querySelector('#energy').textContent=Math.floor(energy)+'%';document.querySelector('#meter').style.width=energy+'%';document.querySelector('#mode').textContent=night?'NIGHT RIDE':'SUNSET';controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
