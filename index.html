<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>恐龙公路摇滚 · Dino Road Rock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000;font-weight:700}.top{display:flex;justify-content:space-between;padding:14px 18px;font-size:clamp(13px,2.1vw,19px)}#hint{position:absolute;left:50%;top:17%;transform:translateX(-50%);text-align:center;opacity:.9;font-size:clamp(13px,2.4vw,20px);transition:opacity .5s}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#09101dcc;border:1px solid #ffffff44;border-radius:18px;padding:24px;box-shadow:0 12px 50px #0008;max-width:90vw}.panel h1{margin:0 0 7px;color:#ffd66b}.panel p{margin:8px 0;color:#d7e4ff}.hidden{display:none}.badge{display:inline-block;margin:3px;padding:4px 8px;border-radius:9px;background:#ffffff22;font-size:12px}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.cluster{display:flex;gap:9px;pointer-events:auto}.btn{width:57px;height:57px;border:1px solid #fff6;border-radius:16px;background:#10233dcc;color:white;font-size:23px;font-weight:800;box-shadow:0 4px 10px #0006}.btn:active{background:#f3a33d99;transform:scale(.94)}#start{cursor:pointer;border:0;border-radius:12px;background:#ef963b;color:#1d1720;padding:11px 22px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><span id="stats">能量 0　距离 0m　速度 0</span><span id="scene">黄昏 · 画质 高</span></div><div id="hint">W/S 加减速　A/D 变道　空格跳跃　T 弹吉他　C 切换镜头</div><div id="menu" class="panel"><h1>🦖 恐龙公路摇滚</h1><p>戴头盔、墨镜，围巾随风飘扬的森林骑行之旅</p><p>拾取能量，躲开障碍，让鹌鹑跳舞、鸵鸟点头，听节奏随踏频变化。</p><button id="start">开始骑行</button><div><span class="badge">14 个成就</span><span class="badge">自动驾驶</span><span class="badge">触屏支持</span></div></div></div>
<div class="controls"><div class="cluster"><button class="btn" data-key="a">◀</button><button class="btn" data-key="d">▶</button></div><div class="cluster"><button class="btn" data-key="s">−</button><button class="btn" data-key="w">＋</button><button class="btn" data-key=" ">⤒</button><button class="btn" data-key="t">♫</button></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),menu=document.querySelector('#menu'),hint=document.querySelector('#hint'),stats=document.querySelector('#stats'),scene=document.querySelector('#scene');let W,H,dpr,playing=false,last=0,time=0,world=0,speed=0,lane=1,targetLane=1,jump=0,energy=0,score=0,cam=0,guitar=0,auto=true,quality=2,particles=[],keys={},audio,beat=0,ach=Array(14).fill(false);
function resize(){dpr=Math.min(devicePixelRatio,quality===2?2:1.25);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const lanes=[-.46,0,.46];function press(k){keys[k]=1;if(k==='c')cam=(cam+1)%5;if(k==='t'){guitar=1;playNote(220+speed*7)}if(k===' ')jump=Math.max(jump,.65)}function release(k){keys[k]=0}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k===' ')e.preventDefault();press(k)});addEventListener('keyup',e=>release(e.key.toLowerCase()));document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});b.addEventListener('pointerup',()=>release(k));b.addEventListener('pointerleave',()=>release(k))});
function start(){menu.classList.add('hidden');playing=true;hint.style.opacity=1;setTimeout(()=>hint.style.opacity=0,7000);initAudio()}document.querySelector('#start').onclick=start;
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();}
function playNote(f){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.22);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.23)}
function rnd(a,b){return a+Math.random()*(b-a)}function add(p){particles.push(p)}
function tree(px,py,s,near=false){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle='#3c2418';x.fillRect(-7,-85,14,88);x.fillStyle=near?'#153d2b':'#1b5337';for(let i=0;i<3;i++){x.beginPath();x.moveTo(0,-155+i*28);x.lineTo(-48+i*8,-70+i*20);x.lineTo(48-i*8,-70+i*20);x.closePath();x.fill()}x.restore()}
function roadY(y){return H*.46+(y-H*.46)*1.35}function drawSky(){let p=Math.max(0,(Math.sin(time*.035)+.15)/1.15),g=x.createLinearGradient(0,0,0,H*.6);let r=Math.floor(35+90*p),gg=Math.floor(33+42*p),b=Math.floor(73+12*p);g.addColorStop(0,`rgb(${r*.55},${gg*.55},${b})`);g.addColorStop(1,`rgb(${r},${gg},${b*.65})`);x.fillStyle=g;x.fillRect(0,0,W,H);let star=(1-p)*.9;x.fillStyle=`rgba(255,255,230,${star})`;for(let i=0;i<45;i++){let sx=(i*97)%W,sy=(i*43)%H*.42;x.fillRect(sx,sy,1.5,1.5)}x.fillStyle=`rgba(255,240,190,${star})`;x.beginPath();x.arc(W*.78,H*.16,24,0,7);x.fill();x.fillStyle=`rgba(255,170,60,${p})`;x.beginPath();x.arc(W*.2,H*.48,70,0,7);x.fill()}
function drawWorld(){drawSky();let horizon=H*.47; x.fillStyle='#203b2d';x.fillRect(0,horizon,W,H-horizon);for(let i=0;i<13;i++){let yy=horizon+((i*77-world*.8)% (H-horizon));if(yy<horizon)continue;let s=.42+(yy-horizon)/(H-horizon)*.85;tree((i*163+41)%W,yy,s,i%3===0);tree(W-((i*127+75)%W),yy+15,s*.8,i%2===0)}
// volcano and lava
x.fillStyle='#281d26';x.beginPath();x.moveTo(W*.68,horizon);x.lineTo(W*.77,horizon-170);x.lineTo(W*.87,horizon);x.fill();x.fillStyle='#ff642e';x.beginPath();x.moveTo(W*.76,horizon-145);x.lineTo(W*.77,horizon-95);x.lineTo(W*.81,horizon);x.lineTo(W*.78,horizon);x.lineTo(W*.75,horizon-90);x.closePath();x.fill();
// road perspective
x.fillStyle='#26272b';x.beginPath();x.moveTo(W*.38,horizon);x.lineTo(W*.62,horizon);x.lineTo(W*1.1,H);x.lineTo(-W*.1,H);x.closePath();x.fill();x.strokeStyle='#cfb36b';x.lineWidth=4;x.beginPath();x.moveTo(W*.38,horizon);x.lineTo(-W*.1,H);x.moveTo(W*.62,horizon);x.lineTo(W*1.1,H);x.stroke();for(let i=0;i<8;i++){let yy=horizon+((i*100-world*1.4)% (H-horizon));if(yy<horizon)continue;let q=(yy-horizon)/(H-horizon),cx=W/2; x.fillStyle='#eee4b2';x.fillRect(cx-3,yy,6,25+q*30)}
// dancing quails
for(let i=0;i<3;i++){let qx=W*.12+i*45,qy=horizon+55+Math.sin(time*5+i)*8;x.fillStyle='#8d6546';x.beginPath();x.ellipse(qx,qy,10,15,0,0,7);x.fill();x.fillStyle='#ffd35e';x.beginPath();x.arc(qx+7,qy-12,6,0,7);x.fill();x.strokeStyle='#f2c85c';x.beginPath();x.moveTo(qx-4,qy+13);x.lineTo(qx-9,qy+23);x.moveTo(qx+4,qy+13);x.lineTo(qx+9,qy+23);x.stroke()}
// ostrich
let ox=W*.9,oy=horizon+25+Math.sin(time*2)*4;x.strokeStyle='#bb8b5a';x.lineWidth=8;x.beginPath();x.moveTo(ox,oy+54);x.lineTo(ox-6,oy-34);x.lineTo(ox+7,oy-61);x.stroke();x.fillStyle='#bb8b5a';x.beginPath();x.ellipse(ox+13,oy-65,17,10,.2,0,7);x.fill();x.fillStyle='#f4cc62';x.beginPath();x.moveTo(ox+27,oy-65);x.lineTo(ox+45,oy-61);x.lineTo(ox+27,oy-57);x.fill();x.strokeStyle='#bb8b5a';x.lineWidth=4;x.beginPath();x.moveTo(ox-4,oy+52);x.lineTo(ox-18,oy+76);x.moveTo(ox+4,oy+52);x.lineTo(ox+18,oy+76);x.stroke()}
}
function bike(px,py){let bob=Math.sin(time*12)*2;py-=jump*90+bob; x.save();x.translate(px,py);let lean=(targetLane-lane)*.15;x.rotate(lean); // wheels
x.strokeStyle='#15161b';x.lineWidth=6;x.beginPath();x.arc(-29,28,25,0,7);x.arc(29,28,25,0,7);x.stroke();x.strokeStyle='#e78a35';x.lineWidth=5;x.beginPath();x.moveTo(-29,28);x.lineTo(-7,-7);x.lineTo(29,28);x.lineTo(-29,28);x.lineTo(7,5);x.lineTo(29,28);x.stroke();x.fillStyle='#e5a243';x.fillRect(-9,-17,18,8); // dinosaur body/head
x.fillStyle='#4dbe70';x.beginPath();x.ellipse(0,-52,24,38,0,0,7);x.fill();x.fillStyle='#68d982';x.beginPath();x.ellipse(13,-91,27,22,-.15,0,7);x.fill();x.fillStyle='#171a24';x.fillRect(0,-113,33,11);x.fillStyle='#6c7d91';x.fillRect(4,-111,25,5);x.fillStyle='#111';x.beginPath();x.arc(27,-95,3,0,7);x.fill(); // arms
x.strokeStyle='#4dbe70';x.lineWidth=9;x.beginPath();x.moveTo(-13,-62);x.lineTo(-23,-17);x.moveTo(13,-62);x.lineTo(23,-17);x.stroke(); // scarf cloth segments
let wind=18+speed*2;x.strokeStyle='#f04c53';x.lineWidth=9;x.beginPath();x.moveTo(-12,-79);x.quadraticCurveTo(-30,-72-wind*.3,-28,-47);x.quadraticCurveTo(-27,-25-wind, -50,-20+Math.sin(time*7)*5);x.stroke();x.strokeStyle='#ffd15c';x.lineWidth=2;x.beginPath();x.moveTo(-13,-79);x.quadraticCurveTo(-31,-72-wind*.3,-29,-47);x.quadraticCurveTo(-28,-25-wind, -50,-20+Math.sin(time*7)*5);x.stroke(); // guitar
x.fillStyle='#d78943';x.beginPath();x.ellipse(35,-42,15,20,0,0,7);x.fill();x.strokeStyle='#f6e0a1';x.lineWidth=2;x.beginPath();x.moveTo(30,-47);x.lineTo(5,-83);x.stroke();if(guitar){x.strokeStyle='#ffe778';x.beginPath();x.arc(35,-42,19,0,7);x.stroke()}x.restore()}
function energyOrb(px,py){x.shadowBlur=18;x.shadowColor='#57eaff';x.fillStyle='#8ff7ff';x.beginPath();x.arc(px,py,10+Math.sin(time*7)*2,0,7);x.fill();x.shadowBlur=0}
let objects=[];function spawn(){let kind=Math.random()<.25?'rock':'energy';objects.push({z:0,lane:Math.floor(rnd(0,3)),kind})}function update(dt){time+=dt;let input=keys.w?1:keys.s?-1:0;if(!input&&auto)input=.32;speed=Math.max(0,Math.min(11,speed+input*dt*4-speed*.06*dt));if(keys.a){targetLane=Math.max(0,targetLane-1);keys.a=0}if(keys.d){targetLane=Math.min(2,targetLane+1);keys.d=0}lane+=(targetLane-lane)*Math.min(1,dt*8);jump=Math.max(0,jump-dt);guitar=Math.max(0,guitar-dt);world+=speed*dt*20;score+=speed*dt;beat+=dt;if(beat>Math.max(.16,.62-speed*.035)){beat=0;playNote(100+speed*16)}if(Math.random()<dt*(.35+speed*.08))spawn();objects.forEach(o=>o.z+=dt*(.12+speed*.035));objects=objects.filter(o=>{if(o.z>.96){if(Math.abs(o.lane-lane)<.32&&!jump){if(o.kind==='energy'){energy++;score+=50;unlock(energy>=1?0:0);playNote(660)}else{speed*=.35;unlock(8)}}return false}return true});if(jump===0&&Math.random()<dt*.03)unlock(1);if(score>500)unlock(2);if(speed>8)unlock(3);if(energy>=10)unlock(4);if(time>60)unlock(5);stats.textContent=`能量 ${energy}　距离 ${Math.floor(score)}m　速度 ${Math.floor(speed*12)} km/h`;let names=['黄昏 ·','星空 ·','午夜 ·','黎明 ·'];scene.textContent=names[Math.floor((time*.035+1)%4)]+` 镜头 ${cam+1}/5 · 画质 ${quality===2?'高':'省电'}`;if(Math.random()<dt*.01)quality=quality===2?1:2}
function unlock(i){if(!ach[i]){ach[i]=1;showToast(`🏆 成就解锁：${['首次充能','轻盈一跃','驶入森林','风驰电掣','能量收藏家','夜行者'][i]||'摇滚恐龙'}`)}}function showToast(t){let e=document.createElement('div');e.textContent=t;e.style='position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#e98f3ddd;border-radius:12px;color:#211820;font-weight:900;z-index:3';document.body.append(e);setTimeout(()=>e.remove(),2200)}
function render(){drawWorld();let horizon=H*.47;objects.forEach(o=>{let z=o.z,yy=horizon+(H-horizon)*z,center=W/2+(lanes[o.lane])*W*.46*z,sz=.45+z*1.6;if(o.kind==='energy')energyOrb(center,yy-25*sz);else{ x.fillStyle='#754a3b';x.beginPath();x.arc(center,yy-20*sz,17*sz,0,7);x.fill();x.fillStyle='#d65c35';x.fillRect(center-4*sz,yy-38*sz,8*sz,18*sz)}});let px=W/2+lanes[lane]*W*.46,py=H*.78;if(cam===1){x.fillStyle='#17252d99';x.fillRect(0,0,W,H);x.fillStyle='#ddc98b';x.font='bold 18px sans-serif';x.fillText('恐龙视角 · 墨镜边缘',22,80)}if(cam===2){x.save();x.translate(W*.2,H*.1);x.scale(.85,.85);bike(px,py);x.restore()}else bike(px,py)}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(playing)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
